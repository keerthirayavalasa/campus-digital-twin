databases:
  - name: campus-digital-twin-db
    databaseName: campus_twin
    user: campus_twin
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: campus-digital-twin
    runtime: python
    plan: starter
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-digital-twin-db
          property: connectionString
